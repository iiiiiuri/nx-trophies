name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Versão
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Testes
        run: python3 -m unittest discover -s tools/tests -t tools/tests

      - name: Overlay
        run: make -C overlay -j4

      - name: Sysmodule
        run: make -C sysmodule -j4

      - name: App
        run: |
          curl -fsSL -o app/romfs/cacert.pem https://curl.se/ca/cacert.pem
          make -C app -j4 APP_VERSION=${{ steps.version.outputs.version }}

      - name: Pacote do SD
        env:
          NOTES: ${{ github.event.head_commit.message || github.ref_name }}
        run: python3 tools/sa.py release --version ${{ steps.version.outputs.version }} --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: switch-achievements-${{ steps.version.outputs.version }}
          path: |
            dist/release/switch-achievements-sd.zip
            dist/release/manifest.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/switch-achievements-sd.zip
            dist/release/manifest.json
          body: |
            Extraia `switch-achievements-sd.zip` na raiz do cartão SD e reinicie o console.
            Depois disso, o app **Conquistas** atualiza sozinho (botão Y).
